<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="agroRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E51937" />
      <stop offset="100%" stop-color="#B30825" />
    </linearGradient>
    <linearGradient id="agroGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A84F" />
      <stop offset="100%" stop-color="#007537" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="240" rx="36" fill="#FFFFFF" />
  
  <!-- Sprout / Leaf Agro Emblem -->
  <g transform="translate(120, 95)">
    <!-- Outer Red Dynamic Arc -->
    <path d="M -50,15 C -50,-35 -10,-65 25,-60 C -15,-45 -25,-10 -15,20 Z" fill="url(#agroRedGrad)" />
    
    <!-- Central Green Leaf -->
    <path d="M -15,25 C -5,-15 35,-45 55,-35 C 45,5 15,35 -10,35 Z" fill="url(#agroGreenGrad)" />
    
    <!-- Growing Seed Center -->
    <circle cx="-12" cy="22" r="9" fill="#007537" />
  </g>

  <!-- Typography -->
  <text x="120" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="900" fill="#B30825" text-anchor="middle" letter-spacing="1.5">AGROBANK</text>
  <text x="120" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#007537" text-anchor="middle" letter-spacing="2.5">PERTANIAN MALAYSIA</text>
</svg>
