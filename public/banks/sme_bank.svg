<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="smeRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E51937" />
      <stop offset="100%" stop-color="#C00822" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="240" rx="36" fill="#FFFFFF" />

  <!-- Iconic SME Bank Red Badge -->
  <g transform="translate(120, 82)">
    <!-- Red rounded capsule -->
    <rect x="-70" y="-45" width="140" height="90" rx="24" fill="url(#smeRedGrad)" />
    <!-- White Lettering "SME" -->
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SME</text>
  </g>

  <!-- Typography -->
  <text x="120" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#1E293B" text-anchor="middle" letter-spacing="3">BANK</text>
  <text x="120" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#C00822" text-anchor="middle" letter-spacing="2">USAHAWAN MIKRO</text>
</svg>
