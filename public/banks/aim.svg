<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="aimCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <linearGradient id="aimMagentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#D00000" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="240" rx="36" fill="#FFFFFF" />

  <!-- AIM Hands of Empowerment Emblem -->
  <g transform="translate(120, 85)">
    <!-- Cyan Upward Wing / Hand -->
    <path d="M -42,15 C -45,-25 -15,-50 10,-55 C -5,-35 -10,-10 0,20 C -15,22 -30,20 -42,15 Z" fill="url(#aimCyanGrad)" />
    
    <!-- Magenta Flame of Hope -->
    <path d="M 42,15 C 45,-25 15,-50 -10,-55 C 5,-35 10,-10 0,20 C 15,22 30,20 42,15 Z" fill="url(#aimMagentaGrad)" />
    
    <!-- Central Rising Star of Prosperity -->
    <circle cx="0" cy="-22" r="11" fill="#FFB703" />
    <path d="M 0,-40 L 4,-26 L 18,-26 L 7,-18 L 11,-4 L 0,-13 L -11,-4 L -7,-18 L -18,-26 L -4,-26 Z" fill="#FFB703" transform="scale(0.8) translate(0, -10)" />
  </g>

  <!-- Typography -->
  <text x="120" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#0077B6" text-anchor="middle" letter-spacing="4">AIM</text>
  <text x="120" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#D00000" text-anchor="middle" letter-spacing="1.2">AMANAH IKHTIAR MALAYSIA</text>
  <text x="120" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">SKIM IKHTIAR MADANI</text>
</svg>
