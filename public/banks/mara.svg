<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="maraBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00358E" />
      <stop offset="100%" stop-color="#001F5C" />
    </linearGradient>
    <linearGradient id="maraGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD100" />
      <stop offset="100%" stop-color="#E5A600" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="240" rx="36" fill="#FFFFFF" />

  <!-- MARA Crest Emblem -->
  <g transform="translate(120, 85)">
    <!-- Outer Gearwheel / Circle in Royal Blue -->
    <circle cx="0" cy="0" r="46" fill="url(#maraBlueGrad)" />
    <circle cx="0" cy="0" r="38" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="34" fill="url(#maraBlueGrad)" />
    
    <!-- Central Golden Torch / Flame -->
    <path d="M 0,-24 C -6,-12 -12,-4 -6,6 C -3,10 0,16 0,22 C 0,16 3,10 6,6 C 12,-4 6,-12 0,-24 Z" fill="url(#maraGoldGrad)" />
    <!-- Torch Base -->
    <rect x="-8" y="16" width="16" height="8" rx="2" fill="#E51937" />
  </g>

  <!-- Typography -->
  <text x="120" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#001F5C" text-anchor="middle" letter-spacing="4">MARA</text>
  <text x="120" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="800" fill="#E51937" text-anchor="middle" letter-spacing="1.2">MAJLIS AMANAH RAKYAT</text>
  <text x="120" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">SKIM SPiM / SPiKE</text>
</svg>
